<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="100%" height="100%">
  <defs>
    <!-- Fire & Sparks Gradient -->
    <radialGradient id="oppFire" cx="50%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="25%" stop-color="#f59e0b"/>
      <stop offset="55%" stop-color="#dc2626"/>
      <stop offset="85%" stop-color="#450a0a"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="300" height="450" fill="#09090b" rx="14"/>

  <!-- Nuclear Blast Core -->
  <circle cx="150" cy="170" r="130" fill="url(#oppFire)"/>

  <!-- Swirling Fire Particles -->
  <g fill="#fde047" opacity="0.8">
    <circle cx="80" cy="110" r="3"/>
    <circle cx="210" cy="120" r="2.5"/>
    <circle cx="230" cy="180" r="3.5"/>
    <circle cx="90" cy="220" r="2"/>
    <circle cx="130" cy="70" r="4"/>
    <circle cx="180" cy="80" r="2.5"/>
    <circle cx="60" cy="160" r="3"/>
    <circle cx="240" cy="140" r="2"/>
  </g>

  <!-- J. Robert Oppenheimer Silhouette in Fedora Hat -->
  <g transform="translate(150, 230) scale(0.9)" fill="#050505">
    <!-- Fedora Brim -->
    <ellipse cx="0" cy="-60" rx="48" ry="10"/>
    <!-- Fedora Crown -->
    <path d="M -26 -60 L -22 -92 Q 0 -96 22 -92 L 26 -60 Z"/>
    <!-- Head / Jaw Silhouette -->
    <path d="M -16 -60 L -14 -35 Q 0 -22 14 -35 L 16 -60 Z"/>
    <!-- Thin Tie & Collar -->
    <path d="M -4 -25 L -7 20 L 0 35 L 7 20 L 4 -25 Z" fill="#18181b"/>
    <!-- Trenchcoat Shoulders -->
    <path d="M -65 60 Q -45 -10 -20 -25 L 20 -25 Q 45 -10 65 60 Z"/>
  </g>

  <!-- Top Director Credits -->
  <text x="150" y="32" font-family="'Cinzel', 'Georgia', serif" font-size="8" font-weight="800" fill="#fde047" text-anchor="middle" letter-spacing="4">
    A FILM BY CHRISTOPHER NOLAN
  </text>

  <!-- Bottom Dark Fade -->
  <rect x="0" y="290" width="300" height="160" fill="linear-gradient(180deg, transparent 0%, #030303 60%)"/>

  <!-- OPPENHEIMER Title -->
  <text x="150" y="365" font-family="'Cinzel', 'Times New Roman', serif" font-size="28" font-weight="900" fill="#fef08a" text-anchor="middle" letter-spacing="4" filter="drop-shadow(0 2px 6px rgba(0,0,0,0.95))">
    OPPENHEIMER
  </text>

  <text x="150" y="405" font-family="system-ui, sans-serif" font-size="8.5" font-weight="800" fill="#f97316" text-anchor="middle" letter-spacing="3">
    THE WORLD FOREVER CHANGES
  </text>
  <text x="150" y="425" font-family="system-ui, sans-serif" font-size="7.5" font-weight="600" fill="#a1a1aa" text-anchor="middle" letter-spacing="2">
    SHOT WITH IMAX 65MM FILM
  </text>
</svg>
