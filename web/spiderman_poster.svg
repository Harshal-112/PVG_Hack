<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="35%" stop-color="#1e1b4b"/>
      <stop offset="70%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#05070f"/>
    </radialGradient>

    <!-- Multiverse Portal Glow -->
    <radialGradient id="portalGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#d97706" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0"/>
    </radialGradient>

    <!-- Spider Suit Gradient -->
    <linearGradient id="suitRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="60%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>

    <!-- Metallic Gold Text Gradient -->
    <linearGradient id="goldText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#facc15"/>
      <stop offset="75%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>

    <!-- Web Texture Pattern -->
    <pattern id="webGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 0 0 L 40 40 M 40 0 L 0 40" stroke="rgba(255,255,255,0.08)" stroke-width="0.8"/>
      <circle cx="20" cy="20" r="14" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="0.8"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="300" height="450" fill="url(#bgGlow)" rx="14"/>
  <rect width="300" height="450" fill="url(#webGrid)" rx="14"/>

  <!-- Multiverse Magic Sparkle Ring (Doctor Strange Portal) -->
  <circle cx="150" cy="180" r="95" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="6,4" opacity="0.85"/>
  <circle cx="150" cy="180" r="102" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="12,6" opacity="0.6"/>
  <circle cx="150" cy="180" r="88" fill="url(#portalGlow)"/>

  <!-- Portal Sparks -->
  <g fill="#fde047" opacity="0.9">
    <circle cx="90" cy="110" r="2.5"/>
    <circle cx="220" cy="120" r="3"/>
    <circle cx="240" cy="210" r="2"/>
    <circle cx="70" cy="230" r="2.5"/>
    <circle cx="120" cy="85" r="3.5"/>
    <circle cx="190" cy="90" r="2"/>
    <circle cx="140" cy="270" r="3"/>
    <circle cx="210" cy="260" r="2"/>
  </g>

  <!-- Dramatic Web Lines from Center -->
  <g stroke="rgba(255,255,255,0.25)" stroke-width="1.2">
    <line x1="150" y1="180" x2="10" y2="20"/>
    <line x1="150" y1="180" x2="290" y2="30"/>
    <line x1="150" y1="180" x2="280" y2="380"/>
    <line x1="150" y1="180" x2="20" y2="390"/>
    <line x1="150" y1="180" x2="150" y2="10"/>
  </g>

  <!-- Spider-Man Emblem / Mask Silhouette -->
  <g transform="translate(150, 180) scale(1.15)">
    <!-- Head Outline -->
    <ellipse cx="0" cy="0" rx="42" ry="54" fill="url(#suitRed)" stroke="#ef4444" stroke-width="2"/>
    
    <!-- Mask Web Lines -->
    <path d="M 0 -54 L 0 54 M -42 0 L 42 0" stroke="rgba(0,0,0,0.4)" stroke-width="1.5"/>
    <path d="M -30 -35 Q 0 -15 30 -35" fill="none" stroke="rgba(0,0,0,0.35)" stroke-width="1.5"/>
    <path d="M -38 -15 Q 0 5 38 -15" fill="none" stroke="rgba(0,0,0,0.35)" stroke-width="1.5"/>
    <path d="M -38 15 Q 0 35 38 15" fill="none" stroke="rgba(0,0,0,0.35)" stroke-width="1.5"/>
    
    <!-- Iconic White Glowing Eyes with Black Border -->
    <!-- Left Eye -->
    <path d="M -8 -12 Q -26 -16 -32 5 Q -22 18 -6 8 Z" fill="#ffffff" stroke="#000000" stroke-width="3.5" filter="drop-shadow(0 0 6px #60a5fa)"/>
    <!-- Right Eye -->
    <path d="M 8 -12 Q 26 -16 32 5 Q 22 18 6 8 Z" fill="#ffffff" stroke="#000000" stroke-width="3.5" filter="drop-shadow(0 0 6px #60a5fa)"/>
  </g>

  <!-- Studio Header -->
  <g transform="translate(150, 32)">
    <rect x="-42" y="-10" width="84" height="20" fill="#dc2626" rx="2"/>
    <text x="0" y="4" font-family="system-ui, sans-serif" font-size="9" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">MARVEL</text>
    <text x="0" y="24" font-family="system-ui, sans-serif" font-size="8" font-weight="700" fill="#94a3b8" text-anchor="middle" letter-spacing="3">STUDIOS</text>
  </g>

  <!-- Bottom Dark Vignette for Text Contrast -->
  <rect x="0" y="290" width="300" height="160" fill="url(#bgGlow)" opacity="0.95"/>
  <linearGradient id="bottomFade" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0.95"/>
  </linearGradient>
  <rect x="0" y="280" width="300" height="170" fill="url(#bottomFade)"/>

  <!-- Movie Title Section -->
  <!-- SPIDER-MAN -->
  <text x="150" y="348" font-family="Impact, system-ui, sans-serif" font-size="34" font-weight="900" fill="url(#goldText)" text-anchor="middle" letter-spacing="2" filter="drop-shadow(0 3px 6px rgba(0,0,0,0.9))">
    SPIDER-MAN
  </text>

  <!-- NO WAY HOME Banner -->
  <g transform="translate(150, 372)">
    <rect x="-85" y="-12" width="170" height="24" fill="#b91c1c" rx="4" stroke="#f87171" stroke-width="1.2"/>
    <text x="0" y="5" font-family="Impact, system-ui, sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">
      NO WAY HOME
    </text>
  </g>

  <!-- Subtitle Tagline / Details -->
  <text x="150" y="415" font-family="system-ui, sans-serif" font-size="9" font-weight="800" fill="#fde047" text-anchor="middle" letter-spacing="4">
    EXCLUSIVELY IN THEATERS
  </text>
  <text x="150" y="432" font-family="system-ui, sans-serif" font-size="7.5" font-weight="600" fill="#64748b" text-anchor="middle" letter-spacing="1.5">
    IMAX &bull; CINEMA 3 &bull; DOLBY ATMOS
  </text>
</svg>
